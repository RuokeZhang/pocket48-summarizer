name: Deploy production

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pocket48-production
  cancel-in-progress: false

jobs:
  validate:
    name: Validate release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Require main branch
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/main"

      - name: Check out release
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.lock

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check -r requirements.lock
          python -m pip install --disable-pip-version-check --no-deps .

      - name: Run release checks
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest -q
          python -m compileall -q src
          node --check src/pocket48_summarizer/static/app.js
          node --check src/pocket48_summarizer/static/i18n.js
          bash -n \
            scripts/deploy-common.sh \
            scripts/deploy-release.sh \
            scripts/rollback-release.sh \
            scripts/bootstrap-github-actions-deploy.sh \
            scripts/github-actions-deploy-command.sh

  deploy:
    name: Deploy production
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 35
    environment:
      name: production
      url: https://p48.ruokezhang.com
    env:
      PRODUCTION_HOST: ${{ vars.PRODUCTION_HOST }}
      PRODUCTION_SSH_USER: ${{ vars.PRODUCTION_SSH_USER }}
    steps:
      - name: Validate deployment configuration
        env:
          PRODUCTION_DEPLOY_KEY: ${{ secrets.PRODUCTION_DEPLOY_KEY }}
          PRODUCTION_SSH_KNOWN_HOSTS: ${{ secrets.PRODUCTION_SSH_KNOWN_HOSTS }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$PRODUCTION_HOST"
          test -n "$PRODUCTION_SSH_USER"
          test -n "$PRODUCTION_DEPLOY_KEY"
          test -n "$PRODUCTION_SSH_KNOWN_HOSTS"

      - name: Configure restricted SSH key
        env:
          PRODUCTION_DEPLOY_KEY: ${{ secrets.PRODUCTION_DEPLOY_KEY }}
          PRODUCTION_SSH_KNOWN_HOSTS: ${{ secrets.PRODUCTION_SSH_KNOWN_HOSTS }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          install -d "$HOME/.ssh"
          printf '%s\n' "$PRODUCTION_DEPLOY_KEY" > "$HOME/.ssh/pocket48-deploy"
          printf '%s\n' "$PRODUCTION_SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"

      - name: Deploy validated commit
        env:
          DEPLOY_COMMIT: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          ssh \
            -i "$HOME/.ssh/pocket48-deploy" \
            -o BatchMode=yes \
            -o ConnectTimeout=15 \
            -o ServerAliveInterval=30 \
            -o ServerAliveCountMax=20 \
            -o StrictHostKeyChecking=yes \
            "$PRODUCTION_SSH_USER@$PRODUCTION_HOST" \
            "$DEPLOY_COMMIT"

      - name: Record deployment
        env:
          DEPLOY_COMMIT: ${{ github.sha }}
        shell: bash
        run: |
          {
            echo "## Production deployment"
            echo
            echo "- Release: \`$DEPLOY_COMMIT\`"
            echo "- URL: https://p48.ruokezhang.com"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Remove deployment key
        if: always()
        shell: bash
        run: rm -f "$HOME/.ssh/pocket48-deploy"
