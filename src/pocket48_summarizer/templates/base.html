<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}口袋48直播总结{% endblock %}</title>
    {% if csrf_token %}<meta name="csrf-token" content="{{ csrf_token }}">{% endif %}
    <link rel="stylesheet" href="{{ url_for('static', path='/styles.css') }}?v=20260829-9">
    {% block head_scripts %}{% endblock %}
    <script defer src="{{ url_for('static', path='/i18n.js') }}?v=20260829-9"></script>
    <script defer src="{{ url_for('static', path='/app.js') }}?v=20260829-9"></script>
  </head>
  <body>
    <header class="site-header">
      <a class="brand" href="/">
        <span class="brand-mark">48</span>
        <span>
          <strong>Replay Summarizer</strong>
          <small data-i18n="brandSubtitle">公开回放字幕与总结</small>
        </span>
      </a>
      {% if current_user %}
        <div class="account-actions">
          <span class="local-pill">{{ current_user.username }}</span>
          {% if current_user.is_admin %}
            <a class="login-link" href="/admin/glossary" data-i18n="glossaryNav">词库</a>
          {% endif %}
          {% if csrf_token %}
            <form action="/logout" method="post">
              <input type="hidden" name="_csrf" value="{{ csrf_token }}">
              <button class="logout-button" type="submit" data-i18n="logout">退出</button>
            </form>
          {% endif %}
          <button
            id="language-toggle"
            class="language-toggle"
            type="button"
            aria-label="切换为英文"
          >EN</button>
        </div>
      {% else %}
        <div class="account-actions">
          <a class="login-link" href="/login" data-i18n="login">登录</a>
          <button
            id="language-toggle"
            class="language-toggle"
            type="button"
            aria-label="切换为英文"
          >EN</button>
        </div>
      {% endif %}
    </header>
    <main class="page-shell">
      {% block content %}{% endblock %}
    </main>
    <nav
      id="mobile-history-nav"
      class="mobile-history-nav"
      aria-label="页面导航"
      data-i18n-aria-label="historyNavigation"
    >
      <button
        id="history-back"
        type="button"
        aria-label="后退"
        title="后退"
        data-i18n-aria-label="goBack"
        data-i18n-title="goBack"
      ><span aria-hidden="true">&lsaquo;</span></button>
      <button
        id="history-forward"
        type="button"
        aria-label="前进"
        title="前进"
        data-i18n-aria-label="goForward"
        data-i18n-title="goForward"
      ><span aria-hidden="true">&rsaquo;</span></button>
    </nav>
  </body>
</html>
